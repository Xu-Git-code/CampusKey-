; ================================================================
;  校园网自动登录 - 配置模板
;
;  用法：复制本文件为 config.ini，然后修改 [login] 里的账号密码。
;        config.ini 已被 .gitignore 忽略，不会被提交到 GitHub。
; ================================================================

[general]
; 启动后先等几秒再执行（秒）。网络慢也没关系，后面还有 network_wait 兜底。
startup_delay = 10

; 等网络就绪的最长时间（秒）。开机时 WiFi 连得慢，脚本会一直等到门户可达。
network_wait = 180

; 网络错误时最多尝试几次（密码错误这类明确失败不会重试，防止锁号）
retry_times = 2

; 每次重试之间等待多少秒
retry_interval = 8

; 单个 HTTP 请求超时（秒）
http_timeout = 10

; 学校门户是 https 且证书不被信任时，改成 false
verify_ssl = true

; 是否走系统代理。校园网门户一般在局域网，建议 false。
use_system_proxy = false

; 日志级别：DEBUG / INFO / WARNING
log_level = INFO

; 是否把最后一次请求/响应写到 logs 目录
dump = true

[check]
; 判断“已经联网”的检测地址。
;
; 注意：不要用 generate_204 这类地址。很多校园网关会把它加入白名单，
; 未登录也返回 204，脚本会误判“已在线”而不去登录。
; 这里用百度：返回 200 且页面里有“百度”才算真的通网。
url = http://www.baidu.com
expect_status = 200
expect_contains = 百度

; 备用检测地址：主地址请求失败时再试
fallback_url = http://example.com
fallback_contains = Example Domain

; 检测超时 / 尝试次数 / 每次间隔（秒）
timeout = 6
attempts = 5
interval = 8

[login]
; 抓包内容文件（与 config.ini 同目录）
request_file = login_request.txt

; 账号密码（必填）
username = 你的学号
password = 你的密码

; 登录前先 GET 门户页拿 Cookie（多数 ePortal / 深澜 / Dr.COM 需要）
warmup = true
warmup_url =

; 是否跟随 302 跳转。一般 false，方便看到服务器真实返回。
allow_redirects = false

; 判断成功 / 失败的关键字（逗号分隔，不区分大小写）。留空用内置默认值。
success_keyword = success,成功,已登录,认证成功
failure_keyword = fail,失败,错误,error,密码不正确,密码错误,验证码,欠费,停机

; 登录后等几秒再复检网络
verify_delay = 2
